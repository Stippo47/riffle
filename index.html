<!doctype html>
<html lang="en" data-layout="rows" data-home="edge" data-decks="tiles" data-look="plain" data-mark="word">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riffle">
<meta name="theme-color" content="#101113">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Riffle</title>
<script>
// The chosen style, before the first paint. js/app.js keeps this copy up to date.
try {
  var s = JSON.parse(localStorage.getItem('riffle-style'));
  if (s) { var d = document.documentElement.dataset; d.layout = s.layout; d.home = s.home; if (s.decks) d.decks = s.decks; d.look = s.look; if (s.mark) d.mark = s.mark; }
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
